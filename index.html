const App = {
cfg: CFG,
lang: LS.get('cj_lang', 'am'),
t(k) { return (I18N[App.lang] && I18N[App.lang][k]) || I18N.en[k] || k; },
esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
money(n) { return Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 }) + ' ' + CFG.CURRENCY; },
pname(p) { return (App.lang === 'am' && p.name_am) ? p.name_am : p.name_en; },
pdesc(p) { return (App.lang === 'am' && p.desc_am) ? p.desc_am : p.desc_en; },
img(u) { return u || PLACEHOLDER; },
ph: PLACEHOLDER,
token() { return LS.get('cj_token', ''); },
user() { return LS.get('cj_user', null); },
setSession(token, user) { LS.set('cj_token', token); LS.set('cj_user', user); },
clearSession() { LS.del('cj_token'); LS.del('cj_user'); },
logout() { App.clearSession(); location.href = '#/login'; },
guard() {
if (App.token()) return true;
const here = '#/' + __PAGE;
location.replace('#/login?next=' + encodeURIComponent(here + __QS()));
return false;
},
async api(path, opts = {}) {
const headers = {};
if (opts.body) headers['Content-Type'] = 'application/json';
if (App.token()) headers.Authorization = 'Bearer ' + App.token();
let res;
try {
res = await fetch(CFG.API_BASE + path, { method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
} catch { throw new Error(App.t('err')); }
let data = {};
try { data = await res.json(); } catch {}
if (res.status === 401 && !path.startsWith('/api/auth/login') && !path.startsWith('/api/auth/register') && App.token()) {
App.clearSession();
location.replace('#/login?next=' + encodeURIComponent(('#/' + __PAGE) + __QS()));
throw new Error(App.t('need_login'));
}
if (!res.ok) throw new Error(data.error || App.t('err'));
return data;
},
toast(msg) {
let el = document.getElementById('toast');
if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
el.textContent = msg; el.classList.add('show');
clearTimeout(App._tt); App._tt = setTimeout(() => el.classList.remove('show'), 2300);
},
getCart() { return LS.get('cj_cart', []); },
saveCart(c) { LS.set('cj_cart', c); App.updateBadges(); },
addToCart(p, qty, size, color) {
const cart = App.getCart();
const ex = cart.find((i) => String(i.id) === String(p.id) && i.size === size && i.color === color);
if (ex) ex.qty = Math.min(ex.qty + qty, p.stock);
else cart.push({ id: p.id, name_en: p.name_en, name_am: p.name_am, price: p.price, image: p.image_front, size, color, qty, stock: p.stock });
App.saveCart(cart);
},
cartCount() { return App.getCart().reduce((s, i) => s + i.qty, 0); },
getWish() { return LS.get('cj_wish', []).map(String); },
toggleWish(id) {
id = String(id);
let w = App.getWish();
if (w.includes(id)) w = w.filter((x) => x !== id); else w.push(id);
LS.set('cj_wish', w); App.updateBadges();
return w.includes(id);
},
updateBadges() {
const c = document.getElementById('cartCount'); if (c) c.textContent = App.cartCount();
const w = document.getElementById('wishCount'); if (w) w.textContent = App.getWish().length;
},
card(p) {
const wished = App.getWish().includes(String(p.id));
const disc = p.old_price > p.price ? Math.round((1 - p.price / p.old_price) * 100) : 0;
const out = p.stock <= 0;
return `<div class="card">
${out ? `<span class="tag out">${App.t('out')}</span>` : disc ? `<span class="tag">-${disc}%</span>` : ''}
<button class="heart ${wished ? 'on' : ''}" data-wish="${App.esc(p.id)}" aria-label="wishlist">${wished ? '♥' : '♡'}</button>
<a href="#/product?id=${encodeURIComponent(p.id)}">
<div class="img"><img loading="lazy" src="${App.esc(App.img(p.image_front))}" alt="${App.esc(App.pname(p))}" onerror="this.onerror=null;this.src=App.ph"></div>
<div class="info"><div class="name">${App.esc(App.pname(p))}</div>
<div><span class="price">${App.money(p.price)}</span>${p.old_price > p.price ? `<span class="old">${App.money(p.old_price)}</span>` : ''}</div>
<div class="stock-line">${out ? App.t('out_stock') : App.t('in_stock') + ': ' + p.stock} · ${App.esc(p.category)}</div></div>
</a>
<div class="actions"><button class="btn" data-add="${App.esc(p.id)}" ${out ? 'disabled' : ''}>${App.t('add_cart')}</button><a class="btn ghost" href="#/product?id=${encodeURIComponent(p.id)}">${App.t('details')}</a></div></div>`;
},
bindCards(root, products, onWishChange) {
root.querySelectorAll('[data-wish]').forEach((b) => b.addEventListener('click', (e) => {
e.preventDefault();
const on = App.toggleWish(b.dataset.wish);
b.classList.toggle('on', on); b.textContent = on ? '♥' : '♡';
if (onWishChange) onWishChange();
}));
root.querySelectorAll('[data-add]').forEach((b) => b.addEventListener('click', () => {
const p = products.find((x) => String(x.id) === b.dataset.add);
if (!p) return;
if ((p.sizes && p.sizes.length) || (p.colors && p.colors.length)) { App.toast(App.t('choose_opts')); location.href = '#/product?id=' + encodeURIComponent(p.id); return; }
App.addToCart(p, 1, '', ''); App.toast(App.t('added'));
}));
},

const SHUT = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
function enhance(i) {
if (i.dataset.eye || !i.parentNode) return;
i.dataset.eye = '1';
const w = document.createElement('div');
w.style.cssText = 'position:relative;width:100%';
i.parentNode.insertBefore(w, i);
w.appendChild(i);
i.style.paddingRight = '48px';
const b = document.createElement('button');
b.type = 'button';
b.setAttribute('aria-label', 'Show / hide password');
b.innerHTML = OPEN;
b.style.cssText = 'position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:inherit;opacity:.6;cursor:pointer;padding:6px;line-height:0;margin:0;width:auto;min-width:0';
b.onclick = function () { const hidden = i.type === 'password'; i.type = hidden ? 'text' : 'password'; b.innerHTML = hidden ? SHUT : OPEN; };
w.appendChild(b);
}
const run = function () { document.querySelectorAll('input[type=password]').forEach(enhance); };
new MutationObserver(run).observe(document.documentElement, { childList: true, subtree: true });
run();
})();

<script type="application/json" id="pages">{
"about":{"title": "About Us - CJ Online Shopping", "styles": "", "html": "\n<div id=\"app-header\"><\/div>\n<main class=\"container\" style=\"margin-top:16px;max-width:820px\">\n  <div class=\"prose\" id=\"am\" style=\"display:none\"><h1>ስለ እኛ<\/h1>\n<h3>እኛ ማን ነን<\/h3>\n<p>CJ Online Shopping ጥራት ያላቸው ምርቶችን በተመጣጣኝ ዋጋ ወደ ቤትዎ የሚያደርስ የኦንላይን ሱቅ ነው።<\/p>\n<h3>እንዴት ይሰራል<\/h3>\n<ul><li>ነጻ አካውንት ከፍተው ምርቶችን ይመልከቱ።<\/li><li>መጠንና ቀለም መርጠው ወደ ጋሪ ያስገቡ።<\/li><li>ትዕዛዝ ይላኩ፤ በስልክ እናረጋግጣለን።<\/li><li>ወደ አድራሻዎ እናደርሳለን፤ በማንኛውም ጊዜ ይከታተሉ።<\/li><\/ul>\n<\/div>\n  <div class=\"prose\" id=\"en\" style=\"display:none\"><h1>About Us<\/h1>\n<h3>Who we are<\/h3>\n<p>CJ Online Shopping is an online store that brings quality products to your door at fair prices.<\/p>\n<h3>How it works<\/h3>\n<ul><li>Create a free account and browse products.<\/li><li>Choose size and color, add items to your cart.<\/li><li>Place your order. We confirm by phone.<\/li><li>We deliver to your address. Track your order any time.<\/li><\/ul>\n<\/div>\n<\/main>\n<div id=\"app-footer\"><\/div>\n\n\n\n", "scripts": ["App.layout('about'); document.getElementById(App.lang).style.display='';"]},
"account":{"title": "My Account - CJ Online Shopping", "styles": "", "html": "\n<div id=\"app-header\"><\/div>\n<main class=\"container\" style=\"margin-top:16px;max-width:820px\">\n  <h2 id=\"hello\"><\/h2>\n  <div class=\"small-muted\" id=\"mail\"><\/div>\n  <div class=\"tabs\" id=\"tabs\"><\/div>\n  <div id=\"view\"><\/div>\n<\/main>\n<div id=\"app-footer\"><\/div>\n\n\n\n\n", "scripts": ["\n(async function () {\n  if (!App.guard()) return;\n  App.layout('account');\n  const t = App.t, esc = App.esc;\n  const FLOW = ['Pending', 'Confirmed', 'Processing', 'Shipped', 'Delivered'];\n  let user = App.user() || {};\n  let tab = new URLSearchParams(__QS()).get('tab') || 'profile';\n  const view = document.getElementById('view');\n\n  try { user = (await App.api('/api/auth/me')).user; App.setSession(App.token(), user); } catch { return; }\n  hello.textContent = t('welcome_back') + ', ' + user.name; mail.textContent = user.email;\n\n  function drawTabs() {\n    tabs.innerHTML = [['profile', 'profile'], ['orders', 'orders'], ['security', 'security']].map(([k, l]) => `<button class=\"tab ${tab === k ? 'active' : ''}\" data-t=\"${k}\">${t(l)}<\/button>`).join('');\n    tabs.querySelectorAll('.tab').forEach((b) => b.onclick = () => { tab = b.dataset.t; drawTabs(); draw(); });\n  }\n\n  async function draw() {\n    if (tab === 'profile') {\n      view.innerHTML = `<form class=\"panel\" id=\"pf\" style=\"margin-top:0\">\n        <div class=\"field\"><label>${t('email')}<\/label><input class=\"inp\" value=\"${esc(user.email)}\" disabled><\/div>\n        <div class=\"field\"><label>${t('full_name')}<\/label><input class=\"inp\" name=\"name\" required maxlength=\"80\" value=\"${esc(user.name)}\"><\/div>\n        <div class=\"field\"><label>${t('phone')}<\/label><input class=\"inp\" name=\"phone\" type=\"tel\" maxlength=\"20\" value=\"${esc(user.phone)}\"><\/div>\n        <div class=\"field\"><label>${t('address')}<\/label><textarea class=\"inp\" name=\"address\" rows=\"2\" maxlength=\"300\">${esc(user.address)}<\/textarea><\/div>\n        <div id=\"pm\"><\/div><button class=\"btn\">${t('save')}<\/button><\/form>`;\n      pf.addEventListener('submit', async (e) => {\n        e.preventDefault();\n        const f = Object.fromEntries(new FormData(pf));\n        try { const r = await App.api('/api/auth/me', { method: 'PUT', body: f }); user = r.user; App.setSession(App.token(), user); pm.innerHTML = `<div class=\"msg ok\">${t('saved')}<\/div>`; hello.textContent = t('welcome_back') + ', ' + user.name; }\n        catch (er) { pm.innerHTML = `<div class=\"msg err\">${esc(er.message)}<\/div>`; }\n      });\n    }\n\n    if (tab === 'security') {\n      view.innerHTML = `<form class=\"panel\" id=\"sf\" style=\"margin-top:0\"><h3 style=\"margin-bottom:12px\">${t('change_pass')}<\/h3>\n        <div class=\"field\"><label>${t('old_password')}<\/label><input class=\"inp\" type=\"password\" name=\"old_password\" required autocomplete=\"current-password\"><\/div>\n        <div class=\"field\"><label>${t('new_password')}<\/label><input class=\"inp\" type=\"password\" name=\"new_password\" required minlength=\"8\" autocomplete=\"new-password\"><div class=\"small-muted\">${t('pass_hint')}<\/div><\/div>\n        <div id=\"sm\"><\/div><button class=\"btn\">${t('change_pass')}<\/button>\n        <hr style=\"border:0;border-top:1px solid var(--line);margin:18px 0\"><button type=\"button\" class=\"btn ghost\" id=\"lo\">↪ ${t('logout')}<\/button><\/form>`;\n      lo.onclick = App.logout;\n      sf.addEventListener('submit', async (e) => {\n        e.preventDefault();\n        try { await App.api('/api/auth/password', { method: 'POST', body: Object.fromEntries(new FormData(sf)) }); sm.innerHTML = `<div class=\"msg ok\">${t('pass_changed')}<\/div>`; sf.reset(); }\n        catch (er) { sm.innerHTML = `<div class=\"msg err\">${esc(er.message)}<\/div>`; }\n      });\n    }\n\n    if (tab === 'orders') {\n      view.innerHTML = `<div class=\"loader\">${t('loading')}<\/div>`;\n      try {\n        const orders = await App.api('/api/my/orders');\n        view.innerHTML = orders.length ? orders.map((o) => {\n          const idx = FLOW.indexOf(o.status);\n          return `<div class=\"panel\" style=\"margin-top:12px\">\n            <div class=\"row\" style=\"justify-content:space-between\"><b>#${esc(o.order_number)}<\/b><span class=\"pill ${esc(o.status)}\">${t(o.status)}<\/span><\/div>\n            <div class=\"small-muted\">${esc(String(o.created_at).slice(0, 10))}<\/div>\n            ${o.status === 'Cancelled' ? '' : `<div class=\"steps\">${FLOW.map((s, n) => `<div class=\"step ${n < idx ? 'done' : ''} ${n === idx ? 'now' : ''}\"><div class=\"dot\">${n <= idx ? '✓' : n + 1}<\/div>${t(s)}<\/div>`).join('')}<\/div>`}\n            ${o.items.map((i) => `<div class=\"sum-row\"><span>${esc(App.lang === 'am' && i.name_am ? i.name_am : i.name)} × ${i.qty} <span class=\"small-muted\">${esc(i.variant || '')}<\/span><\/span><span>${App.money(i.price * i.qty)}<\/span><\/div>`).join('')}\n            <div class=\"sum-row total\"><span>${t('total')}<\/span><span>${App.money(o.total)}<\/span><\/div>\n            <div class=\"small-muted\" style=\"margin-top:8px\">💳 ${o.pay_method === 'cod' ? t('pay_cod_s') : esc(String(o.pay_method).toUpperCase()) + ' · ' + esc(o.pay_ref || '') + ' · ' + (o.has_proof ? ' 🧾' : '') + ' · ' + (o.pay_status === 'Paid' ? t('pay_paid') : o.pay_status === 'Rejected' ? t('pay_rejected') : t('pay_checking'))}<\/div>\n            ${o.can_cancel ? `<button class=\"btn small ghost\" style=\"margin-top:10px;color:#b42318\" data-cancel=\"${esc(o.order_number)}\">❌ ${t('cancel_order')}<\/button>` : ''}<\/div>`;\n        }).join('') : `<div class=\"panel empty\" style=\"margin-top:0\">${t('no_orders')}<br><br><a class=\"btn\" href=\"#/index\">${t('continue')}<\/a><\/div>`;\n        view.querySelectorAll('[data-cancel]').forEach((b) => b.onclick = async () => {\n          if (!confirm(t('cancel_confirm'))) return;\n          b.disabled = true;\n          try { await App.api('/api/my/orders/' + encodeURIComponent(b.dataset.cancel) + '/cancel', { method: 'POST', body: {} }); draw(); }\n          catch (er) { alert(er.message); b.disabled = false; }\n        });\n      } catch (er) { view.innerHTML = `<div class=\"msg err\">${esc(er.message)}<\/div>`; }\n    }\n  }\n  drawTabs(); draw();\n})();\n"]},
"admin":{"title": "Admin - CJ Online Shopping", "styles": "<style>\n  .logo { color: var(--ink); }\n  .login { max-width: 360px; margin: 12vh auto; }\n  .tabs { display: flex; gap: 6px; overflow-x: auto; margin: 14px 0; }\n  .tab { background: #fff; border: 1px solid var(--line); padding: 9px 18px; border-radius: 999px; cursor: pointer; font-weight: 700; white-space: nowrap; }\n  .tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }\n  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }\n  .stat { background: #fff; border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }\n  .stat b { display: block; font-size: 24px; color: var(--brand); }\n  .stat span { color: var(--muted); font-size: 13px; }\n  table.t { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; font-size: 14px; }\n  table.t th, table.t td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }\n  table.t th { background: #fafafa; font-size: 12px; text-transform: uppercase; color: var(--muted); }\n  .scroll { overflow-x: auto; border-radius: 12px; box-shadow: var(--shadow); }\n  .thumb { width: 46px; height: 46px; object-fit: cover; border-radius: 8px; background: #eee; }\n  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; display: none; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 20px 10px; }\n  .modal-bg.open { display: flex; }\n  .modal { background: #fff; border-radius: 16px; padding: 20px; width: 100%; max-width: 640px; }\n  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }\n  .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }\n  @media (max-width: 560px) { .two, .three { grid-template-columns: 1fr; } }\n  .imgbox { border: 1px dashed var(--line); border-radius: 10px; padding: 8px; text-align: center; font-size: 12px; }\n  .imgbox img { width: 100%; height: 90px; object-fit: cover; border-radius: 8px; margin-bottom: 6px; background: #f3f3f3; }\n  .pill { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #eee; }\n  .pill.Pending { background: #fef0c7; color: #93370d; } .pill.Confirmed, .pill.Processing { background: #d1e9ff; color: #175cd3; }\n  .pill.Shipped { background: #e9d7fe; color: #6941c6; } .pill.Delivered { background: #d1fadf; color: #05603a; } .pill.Cancelled { background: #fee4e2; color: #b42318; }\n  .bars { display: flex; align-items: flex-end; gap: 8px; height: 120px; margin-top: 10px; }\n  .bar { flex: 1; background: linear-gradient(var(--accent), var(--brand)); border-radius: 6px 6px 0 0; min-height: 3px; position: relative; }\n  .bar small { position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--muted); }\n<\/style>", "html": "\n\n<div id=\"loginView\" class=\"container\" style=\"display:none\">\n  <form class=\"panel login\" id=\"loginForm\">\n    <h2 style=\"margin-bottom:14px\">🔐 Admin Login<\/h2>\n    <div class=\"field\"><label>Password<\/label><input class=\"inp\" type=\"password\" name=\"password\" required autofocus><\/div>\n    <div id=\"loginMsg\"><\/div>\n    <button class=\"btn block\">Login<\/button>\n  <\/form>\n<\/div>\n\n<div id=\"adminView\" class=\"container\" style=\"display:none\">\n  <div class=\"row\" style=\"justify-content:space-between;padding:14px 0 0\">\n    <a class=\"logo\" href=\"#/index\">CJ<span> Admin<\/span><\/a>\n    <div class=\"row\"><a class=\"btn ghost small\" href=\"#/index\" target=\"_blank\">View Shop ↗<\/a><button class=\"btn small dark\" id=\"logout\">Logout<\/button><\/div>\n  <\/div>\n  <div class=\"tabs\" id=\"tabs\">\n    <button class=\"tab active\" data-t=\"dash\">📊 Dashboard<\/button>\n    <button class=\"tab\" data-t=\"products\">📦 Products<\/button>\n    <button class=\"tab\" data-t=\"orders\">🧾 Orders<\/button>\n    <button class=\"tab\" data-t=\"coupons\">🏷 Coupons<\/button>\n    <button class=\"tab\" data-t=\"reviews\">⭐ Reviews<\/button>\n    <button class=\"tab\" data-t=\"users\">👥 Customers<\/button>\n  <\/div>\n  <div id=\"content\"><\/div>\n<\/div>\n\n<div class=\"modal-bg\" id=\"modalBg\"><div class=\"modal\" id=\"modal\"><\/div><\/div>\n\n\n\n", "scripts": ["\n(function () {\n  const API = window.CJ_CONFIG.API_BASE;\n  const CUR = window.CJ_CONFIG.CURRENCY;\n  const $ = (id) => document.getElementById(id);\n  const esc = (s) => String(s ?? '').replace(/[&<>\"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\n  const money = (n) => Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 }) + ' ' + CUR;\n  const STATUSES = ['Pending', 'Confirmed', 'Processing', 'Shipped', 'Delivered', 'Cancelled'];\n  let token = localStorage.getItem('cj_admin') || '';\n  let tab = 'dash';\n  let productsCache = [];\n\n  function toast(m) {\n    let el = $('toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }\n    el.textContent = m; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2400);\n  }\n\n  async function api(path, opts = {}) {\n    const headers = { Authorization: 'Bearer ' + token };\n    let body;\n    if (opts.form) body = opts.form; else if (opts.body) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(opts.body); }\n    const res = await fetch(API + path, { method: opts.method || 'GET', headers, body });\n    let data = {}; try { data = await res.json(); } catch {}\n    if (res.status === 401 && path !== '/api/admin/login') { logout(); throw new Error('Session expired'); }\n    if (!res.ok) throw new Error(data.error || 'Error');\n    return data;\n  }\n\n  function showLogin() { $('loginView').style.display = ''; $('adminView').style.display = 'none'; }\n  function showAdmin() { $('loginView').style.display = 'none'; $('adminView').style.display = ''; load(); }\n  function logout() { token = ''; localStorage.removeItem('cj_admin'); showLogin(); }\n  $('logout').onclick = logout;\n\n  $('loginForm').addEventListener('submit', async (e) => {\n    e.preventDefault();\n    try {\n      const r = await fetch(API + '/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: new FormData(e.target).get('password') }) });\n      const d = await r.json();\n      if (!r.ok) throw new Error(d.error || 'Login failed');\n      token = d.token; localStorage.setItem('cj_admin', token); showAdmin();\n    } catch (er) { $('loginMsg').innerHTML = `<div class=\"msg err\">${esc(er.message)}<\/div>`; }\n  });\n\n  $('tabs').addEventListener('click', (e) => {\n    const b = e.target.closest('.tab'); if (!b) return;\n    tab = b.dataset.t;\n    document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('active', x === b));\n    load();\n  });\n\n  async function load() {\n    $('content').innerHTML = '<div class=\"loader\">Loading...<\/div>';\n    try {\n      if (tab === 'dash') await viewDash();\n      if (tab === 'products') await viewProducts();\n      if (tab === 'orders') await viewOrders();\n      if (tab === 'coupons') await viewCoupons();\n      if (tab === 'reviews') await viewReviews();\n      if (tab === 'users') await viewUsers();\n    } catch (e) { $('content').innerHTML = `<div class=\"msg err\">${esc(e.message)}<\/div>`; }\n  }\n\n  // ---------- Dashboard ----------\n  async function viewDash() {\n    const s = await api('/api/admin/stats');\n    const max = Math.max(1, ...s.daily.map((d) => d.s));\n    $('content').innerHTML = `\n      <div class=\"stats\">\n        <div class=\"stat\"><b>${s.today_orders}<\/b><span>Today's orders<\/span><\/div>\n        <div class=\"stat\"><b>${money(s.today_revenue)}<\/b><span>Today's sales<\/span><\/div>\n        <div class=\"stat\"><b>${s.orders}<\/b><span>Total orders<\/span><\/div>\n        <div class=\"stat\"><b>${money(s.revenue)}<\/b><span>Total sales<\/span><\/div>\n        <div class=\"stat\"><b>${s.pending}<\/b><span>Pending orders<\/span><\/div>\n        <div class=\"stat\"><b>${s.products}<\/b><span>Products<\/span><\/div>\n      <\/div>\n      <div class=\"panel\"><h3>Last 7 days<\/h3>\n        ${s.daily.length ? `<div class=\"bars\">${s.daily.map((d) => `<div class=\"bar\" style=\"height:${Math.max(3, (d.s / max) * 100)}%\" title=\"${esc(d.d)}: ${money(d.s)} (${d.c})\"><small>${esc(d.d.slice(5))}<\/small><\/div>`).join('')}<\/div><div style=\"height:20px\"><\/div>` : '<p class=\"small-muted\">No sales yet.<\/p>'}\n      <\/div>\n      <div class=\"two\">\n        <div class=\"panel\"><h3>Orders by status<\/h3>${s.by_status.length ? s.by_status.map((x) => `<div class=\"sum-row\"><span class=\"pill ${esc(x.status)}\">${esc(x.status)}<\/span><b>${x.c}<\/b><\/div>`).join('') : '<p class=\"small-muted\">No orders yet.<\/p>'}<\/div>\n        <div class=\"panel\"><h3>⚠️ Low stock (≤5)<\/h3>${s.low_stock.length ? s.low_stock.map((x) => `<div class=\"sum-row\"><span>${esc(x.name_en)}<\/span><b>${x.stock}<\/b><\/div>`).join('') : '<p class=\"small-muted\">All good ✓<\/p>'}<\/div>\n      <\/div>`;\n  }\n\n  // ---------- Products ----------\n  async function viewProducts() {\n    productsCache = await api('/api/admin/products');\n    $('content').innerHTML = `\n      <div class=\"row\" style=\"justify-content:space-between;margin-bottom:10px\"><h2>Products (${productsCache.length})<\/h2><button class=\"btn\" id=\"addP\">+ Add Product<\/button><\/div>\n      <div class=\"scroll\"><table class=\"t\"><thead><tr><th><\/th><th>Name<\/th><th>Category<\/th><th>Price<\/th><th>Stock<\/th><th>Status<\/th><th><\/th><\/tr><\/thead><tbody>\n      ${productsCache.map((p) => `<tr>\n        <td><img class=\"thumb\" src=\"${esc(p.image_front || '')}\" alt=\"\"><\/td>\n        <td><b>${esc(p.name_en)}<\/b><br><span class=\"small-muted\">${esc(p.name_am)}<\/span><\/td>\n        <td>${esc(p.category)}<\/td>\n        <td>${money(p.price)}${p.old_price > 0 ? `<br><span class=\"old\" style=\"margin:0\">${money(p.old_price)}<\/span>` : ''}<\/td>\n        <td style=\"${p.stock <= 5 ? 'color:#d92d20;font-weight:700' : ''}\">${p.stock}<\/td>\n        <td>${p.active ? '<span class=\"pill Delivered\">Active<\/span>' : '<span class=\"pill\">Hidden<\/span>'} ${p.featured ? '⭐' : ''}<\/td>\n        <td style=\"white-space:nowrap\"><button class=\"btn small ghost\" data-e=\"${p.id}\">Edit<\/button> <button class=\"btn small\" data-d=\"${p.id}\" style=\"background:#d92d20\">Delete<\/button><\/td>\n      <\/tr>`).join('') || '<tr><td colspan=\"7\" class=\"empty\">No products yet<\/td><\/tr>'}\n      <\/tbody><\/table><\/div>`;\n    $('addP').onclick = () => productForm();\n    document.querySelectorAll('[data-e]').forEach((b) => b.onclick = () => productForm(productsCache.find((p) => p.id == b.dataset.e)));\n    document.querySelectorAll('[data-d]').forEach((b) => b.onclick = async () => {\n      if (!confirm('Delete this product?')) return;\n      try { await api('/api/admin/products/' + b.dataset.d, { method: 'DELETE' }); toast('Deleted'); load(); } catch (e) { toast(e.message); }\n    });\n  }\n\n  function openModal(html) { $('modal').innerHTML = html; $('modalBg').classList.add('open'); }\n  function closeModal() { $('modalBg').classList.remove('open'); }\n  $('modalBg').addEventListener('mousedown', (e) => { if (e.target === $('modalBg')) closeModal(); });\n\n  function productForm(p) {\n    p = p || { name_en: '', name_am: '', desc_en: '', desc_am: '', category: '', price: '', old_price: 0, stock: 0, sizes: '', colors: '', image_front: '', image_side: '', image_top: '', featured: 0, active: 1 };\n    const img = (k, label) => `<div class=\"imgbox\"><img id=\"pv_${k}\" src=\"${esc(p[k] || '')}\" alt=\"\"><b>${label}<\/b>\n      <input class=\"inp\" name=\"${k}\" value=\"${esc(p[k] || '')}\" placeholder=\"Image URL\" style=\"margin:6px 0;padding:6px\">\n      <\/div>`;\n    openModal(`<h2 style=\"margin-bottom:12px\">${p.id ? 'Edit' : 'Add'} Product<\/h2>\n    <form id=\"pf\">\n      <div class=\"two\"><div class=\"field\"><label>Name (English) *<\/label><input class=\"inp\" name=\"name_en\" required value=\"${esc(p.name_en)}\"><\/div>\n      <div class=\"field\"><label>ስም (አማርኛ)<\/label><input class=\"inp\" name=\"name_am\" value=\"${esc(p.name_am)}\"><\/div><\/div>\n      <div class=\"two\"><div class=\"field\"><label>Description (English)<\/label><textarea class=\"inp\" name=\"desc_en\" rows=\"3\">${esc(p.desc_en)}<\/textarea><\/div>\n      <div class=\"field\"><label>መግለጫ (አማርኛ)<\/label><textarea class=\"inp\" name=\"desc_am\" rows=\"3\">${esc(p.desc_am)}<\/textarea><\/div><\/div>\n      <div class=\"three\"><div class=\"field\"><label>Price customers pay (${CUR}) *<\/label><input class=\"inp\" type=\"number\" step=\"0.01\" min=\"0\" name=\"price\" required value=\"${esc(p.price)}\"><\/div>\n      <div class=\"field\"><label>Old price (optional — shows a discount)<\/label><input class=\"inp\" type=\"number\" step=\"0.01\" min=\"0\" name=\"old_price\" value=\"${esc(p.old_price)}\"><\/div>\n      <div class=\"field\"><label>Stock<\/label><input class=\"inp\" type=\"number\" min=\"0\" name=\"stock\" value=\"${esc(p.stock)}\"><\/div><\/div>\n      <div class=\"three\"><div class=\"field\"><label>Category<\/label><input class=\"inp\" name=\"category\" list=\"cats\" value=\"${esc(p.category)}\" placeholder=\"Shoes\"><datalist id=\"cats\">${[...new Set(productsCache.map((x) => x.category))].map((c) => `<option value=\"${esc(c)}\">`).join('')}<\/datalist><\/div>\n      <div class=\"field\"><label>Sizes (comma separated)<\/label><input class=\"inp\" name=\"sizes\" value=\"${esc(p.sizes)}\" placeholder=\"S,M,L\"><\/div>\n      <div class=\"field\"><label>Colors (comma separated)<\/label><input class=\"inp\" name=\"colors\" value=\"${esc(p.colors)}\" placeholder=\"Black,White\"><\/div><\/div>\n      <div class=\"opt-title\">Photos (3 per product — paste image links)<\/div>\n      <div class=\"three\">${img('image_front', '1')}${img('image_side', '2')}${img('image_top', '3')}<\/div>\n      <div class=\"field\" style=\"margin-top:12px\"><label>Video URL (optional — .mp4 link or YouTube. Phone upload comes later with R2)<\/label><input class=\"inp\" name=\"video\" value=\"${esc(p.video || '')}\"><\/div>\n      <div class=\"row\" style=\"margin:14px 0\"><label><input type=\"checkbox\" name=\"featured\" ${p.featured ? 'checked' : ''}> ⭐ Featured<\/label><label><input type=\"checkbox\" name=\"active\" ${p.active ? 'checked' : ''}> Visible in shop<\/label><\/div>\n      <div id=\"pfMsg\"><\/div>\n      <div class=\"row\"><button class=\"btn\">Save<\/button><button type=\"button\" class=\"btn ghost\" id=\"cancelP\">Cancel<\/button><\/div>\n    <\/form>`);\n    $('cancelP').onclick = closeModal;\n    const f = $('pf');\n    f.querySelectorAll('input[name^=\"image_\"]').forEach((i) => i.addEventListener('input', () => { $('pv_' + i.name).src = i.value; }));\n    f.querySelectorAll('[data-up]').forEach((inp) => inp.addEventListener('change', async () => {\n      const file = inp.files[0]; if (!file) return;\n      const fd = new FormData(); fd.append('file', file);\n      try { const r = await api('/api/admin/upload', { method: 'POST', form: fd }); f.elements[inp.dataset.up].value = r.url; $('pv_' + inp.dataset.up).src = r.url; toast('Uploaded ✓'); }\n      catch (e) { toast(e.message); }\n    }));\n    f.addEventListener('submit', async (e) => {\n      e.preventDefault();\n      const d = Object.fromEntries(new FormData(f));\n      d.featured = f.elements.featured.checked ? 1 : 0; d.active = f.elements.active.checked ? 1 : 0;\n      try {\n        if (p.id) await api('/api/admin/products/' + p.id, { method: 'PUT', body: d }); else await api('/api/admin/products', { method: 'POST', body: d });\n        closeModal(); toast('Saved ✓'); load();\n      } catch (er) { $('pfMsg').innerHTML = `<div class=\"msg err\">${esc(er.message)}<\/div>`; }\n    });\n  }\n\n  // ---------- Orders ----------\n  let orderFilter = '';\n  async function viewOrders() {\n    const orders = await api('/api/admin/orders' + (orderFilter ? '?status=' + orderFilter : ''));\n    $('content').innerHTML = `\n      <div class=\"row\" style=\"justify-content:space-between;margin-bottom:10px\"><h2>Orders (${orders.length})<\/h2>\n        <select class=\"sel\" id=\"of\"><option value=\"\">All statuses<\/option>${STATUSES.map((s) => `<option ${s === orderFilter ? 'selected' : ''}>${s}<\/option>`).join('')}<\/select><\/div>\n      ${orders.map((o) => `<div class=\"panel\" style=\"margin-top:10px\">\n        <div class=\"row\" style=\"justify-content:space-between\"><b>#${esc(o.order_number)}<\/b><span class=\"small-muted\">${esc(o.created_at)} UTC<\/span><\/div>\n        <div style=\"margin:6px 0\">👤 ${esc(o.customer_name)} · 📞 <a href=\"tel:${esc(o.phone)}\" style=\"color:var(--brand)\">${esc(o.phone)}<\/a><br>📍 ${esc(o.address)}${o.note ? `<br>📝 ${esc(o.note)}` : ''}<\/div>\n        ${o.items.map((i) => `<div class=\"small-muted\">• ${esc(i.name)} × ${i.qty} ${esc(i.size || '')} ${esc(i.color || '')} — ${money(i.price * i.qty)}<\/div>`).join('')}\n        ${o.pay_method && o.pay_method !== 'cod' ? `<div style=\"margin-top:8px;padding:8px 10px;border-radius:10px;background:${o.pay_status === 'Paid' ? '#d1fadf' : o.pay_status === 'Rejected' ? '#fee4e2' : '#fef0c7'}\">💳 <b>${esc(o.pay_method.toUpperCase())}<\/b> · ref: <b style=\"user-select:all\">${esc(o.pay_ref)}<\/b> · ${esc(o.pay_status)}\n          ${o.has_proof ? `<button class=\"btn small ghost\" data-proof=\"${o.id}\">🧾 View receipt<\/button> ` : ''}<button class=\"btn small\" data-pay=\"${o.id}|Paid\">✅ Paid<\/button> <button class=\"btn small ghost\" data-pay=\"${o.id}|Rejected\">✖ Reject<\/button><\/div>` : '<div class=\"small-muted\" style=\"margin-top:6px\">💵 Cash on delivery<\/div>'}\n        <div class=\"row\" style=\"justify-content:space-between;margin-top:10px\">\n          <div><b>${money(o.total)}<\/b>${o.discount > 0 ? ` <span class=\"small-muted\">(${esc(o.coupon_code)} -${money(o.discount)})<\/span>` : ''} <span class=\"small-muted\">· ship ${money(o.shipping || 0)}<\/span><\/div>\n          <div class=\"row\"><select class=\"sel\" data-s=\"${o.id}\">${STATUSES.map((s) => `<option ${s === o.status ? 'selected' : ''}>${s}<\/option>`).join('')}<\/select>\n          <button class=\"btn small ghost\" data-del=\"${o.id}\">🗑<\/button><\/div>\n        <\/div><\/div>`).join('') || '<div class=\"panel empty\">No orders<\/div>'}`;\n    $('of').onchange = (e) => { orderFilter = e.target.value; load(); };\n    document.querySelectorAll('[data-s]').forEach((s) => s.onchange = async () => {\n      try { await api(`/api/admin/orders/${s.dataset.s}/status`, { method: 'PUT', body: { status: s.value } }); toast('Status updated ✓'); } catch (e) { toast(e.message); }\n    });\n    document.querySelectorAll('[data-proof]').forEach((b) => b.onclick = async () => {\n      try {\n        const r = await api('/api/admin/orders/' + b.dataset.proof + '/proof');\n        const d = document.createElement('div'); d.style.cssText = 'position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:14px;overflow:auto';\n        d.innerHTML = '<img src=\"' + r.proof + '\" style=\"max-width:100%;max-height:92vh;border-radius:10px\">'; d.onclick = () => d.remove(); document.body.appendChild(d);\n      } catch (e) { toast(e.message); }\n    });\n    document.querySelectorAll('[data-pay]').forEach((b) => b.onclick = async () => {\n      const [id, ps] = b.dataset.pay.split('|');\n      try { await api(`/api/admin/orders/${id}/payment`, { method: 'PUT', body: { pay_status: ps } }); toast('Payment ' + ps + ' ✓'); load(); } catch (e) { toast(e.message); }\n    });\n    document.querySelectorAll('[data-del]').forEach((b) => b.onclick = async () => {\n      if (!confirm('Delete this order permanently?')) return;\n      try { await api('/api/admin/orders/' + b.dataset.del, { method: 'DELETE' }); load(); } catch (e) { toast(e.message); }\n    });\n  }\n\n  // ---------- Coupons ----------\n  async function viewCoupons() {\n    const list = await api('/api/admin/coupons');\n    $('content').innerHTML = `\n      <form class=\"panel row\" id=\"cf\" style=\"margin-top:0\"><input class=\"inp\" name=\"code\" placeholder=\"CODE (e.g. SAVE10)\" required style=\"max-width:220px\"><input class=\"inp\" name=\"percent\" type=\"number\" min=\"1\" max=\"100\" placeholder=\"% off\" required style=\"max-width:120px\"><button class=\"btn\">Add coupon<\/button><\/form>\n      <div class=\"scroll\" style=\"margin-top:12px\"><table class=\"t\"><thead><tr><th>Code<\/th><th>Discount<\/th><th>Active<\/th><th><\/th><\/tr><\/thead><tbody>\n      ${list.map((c) => `<tr><td><b>${esc(c.code)}<\/b><\/td><td>${c.percent}%<\/td><td><input type=\"checkbox\" data-a=\"${c.id}\" ${c.active ? 'checked' : ''}><\/td><td><button class=\"btn small ghost\" data-cd=\"${c.id}\">Delete<\/button><\/td><\/tr>`).join('') || '<tr><td colspan=\"4\" class=\"empty\">No coupons<\/td><\/tr>'}\n      <\/tbody><\/table><\/div>`;\n    $('cf').onsubmit = async (e) => {\n      e.preventDefault(); const f = new FormData(e.target);\n      try { await api('/api/admin/coupons', { method: 'POST', body: { code: f.get('code'), percent: Number(f.get('percent')) } }); load(); } catch (er) { toast(er.message); }\n    };\n    document.querySelectorAll('[data-a]').forEach((c) => c.onchange = async () => { try { await api('/api/admin/coupons/' + c.dataset.a, { method: 'PUT', body: { active: c.checked } }); toast('Updated ✓'); } catch (e) { toast(e.message); } });\n    document.querySelectorAll('[data-cd]').forEach((b) => b.onclick = async () => { if (!confirm('Delete coupon?')) return; try { await api('/api/admin/coupons/' + b.dataset.cd, { method: 'DELETE' }); load(); } catch (e) { toast(e.message); } });\n  }\n\n  // ---------- Customers ----------\n  async function viewUsers() {\n    const list = await api('/api/admin/users');\n    $('content').innerHTML = `<h2 style=\"margin-bottom:10px\">Customers (${list.length})<\/h2><div class=\"scroll\"><table class=\"t\"><thead><tr><th>Name<\/th><th>Email<\/th><th>Phone<\/th><th>Joined<\/th><\/tr><\/thead><tbody>\n      ${list.map((u) => `<tr><td><b>${esc(u.name)}<\/b><\/td><td>${esc(u.email)}<\/td><td>${esc(u.phone || '')}<\/td><td>${esc(String(u.created_at || '').slice(0, 10))}<\/td><\/tr>`).join('') || '<tr><td colspan=\"4\" class=\"empty\">No customers yet<\/td><\/tr>'}\n      <\/tbody><\/table><\/div>`;\n  }\n\n  // ---------- Reviews ----------\n  async function viewReviews() {\n    const list = await api('/api/admin/reviews');\n    $('content').innerHTML = `<h2 style=\"margin-bottom:10px\">Reviews (${list.length})<\/h2>` +\n      (list.map((r) => `<div class=\"panel\" style=\"margin-top:8px\"><div class=\"row\" style=\"justify-content:space-between\"><div><b>${esc(r.name)}<\/b> <span class=\"stars\">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}<\/span><div class=\"small-muted\">on ${esc(r.product || 'deleted product')} · ${esc(r.created_at)}<\/div><\/div><button class=\"btn small ghost\" data-rd=\"${r.id}\">Delete<\/button><\/div><div style=\"margin-top:6px\">${esc(r.comment)}<\/div><\/div>`).join('') || '<div class=\"panel empty\">No reviews<\/div>');\n    document.querySelectorAll('[data-rd]').forEach((b) => b.onclick = async () => { if (!confirm('Delete review?')) return; try { await api('/api/admin/reviews/' + b.dataset.rd, { method: 'DELETE' }); load(); } catch (e) { toast(e.message); } });\n  }\n\n  token ? showAdmin() : showLogin();\n})();\n"]},
"cart":{"title": "Cart - CJ Online Shopping", "styles": "", "html": "\n<div id=\"app-header\"><\/div>\n<main class=\"container\" style=\"margin-top:16px\">\n  <h2 id=\"title\" style=\"margin-bottom:12px\"><\/h2>\n  <div id=\"view\"><\/div>\n<\/main>\n<div id=\"app-footer\"><\/div>\n\n\n\n\n", "scripts": ["\n(function () {\n  if (!App.guard()) return;\n  App.layout('');\n  const t = App.t, esc = App.esc;\n  const view = document.getElementById('view');\n  const user = App.user() || {};\n  document.getElementById('title').textContent = t('my_cart');\n  let coupon = null;\n  let cfg = { free_shipping_min: 3000, shipping_fee: 100 };\n  let form = { name: user.name || '', phone: user.phone || '', address: user.address || '', note: '' };\n  App.api('/api/config').then((c) => { cfg = c; saveForm(); render(); }).catch(() => {});\n  App.api('/api/auth/me').then((r) => { // refresh saved profile info\n    saveForm();\n    const u = r.user; App.setSession(App.token(), u);\n    form = { name: form.name || u.name, phone: form.phone || u.phone || '', address: form.address || u.address || '', note: form.note };\n    render();\n  }).catch(() => {});\n\n  function totals() {\n    const sub = App.getCart().reduce((s, i) => s + i.price * i.qty, 0);\n    const disc = coupon ? Math.round((sub * coupon.percent) / 100) : 0;\n    const ship = sub >= cfg.free_shipping_min ? 0 : cfg.shipping_fee;\n    return { sub, disc, ship, total: Math.max(0, sub - disc + ship) };\n  }\n  let payMethod = 'cod', payProof = '';\n  function compress(file) {\n    return new Promise((ok, no) => {\n      const fr = new FileReader();\n      fr.onerror = no;\n      fr.onload = () => { const im = new Image(); im.onerror = no; im.onload = () => {\n        const s = Math.min(1, 900 / Math.max(im.width, im.height)); const c = document.createElement('canvas');\n        c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);\n        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);\n        let q = 0.7, d = c.toDataURL('image/jpeg', q); while (d.length > 300000 && q > 0.3) { q -= 0.1; d = c.toDataURL('image/jpeg', q); }\n        ok(d); }; im.src = fr.result; };\n      fr.readAsDataURL(file);\n    });\n  }\n  function methods() { return [{ id: 'cod' }].concat(((window.CJ_CONFIG || {}).PAYMENTS || []).filter((m) => m.account)); }\n  function saveForm() {\n    const f = document.getElementById('co'); if (!f) return;\n    form = { name: f.name.value, phone: f.phone.value, address: f.address.value, note: f.note.value, pay_ref: f.pay_ref ? f.pay_ref.value : '' };\n    const pm = f.querySelector('input[name=pay_method]:checked'); if (pm) payMethod = pm.value;\n  }\n\n  function render() {\n    const cart = App.getCart();\n    if (!cart.length) {\n      view.innerHTML = `<div class=\"panel empty\">${t('cart_empty')}<br><br><a class=\"btn\" href=\"#/index\">${t('continue')}<\/a><\/div>`;\n      return;\n    }\n    const tt = totals();\n    view.innerHTML = `\n    <div class=\"cart-wrap\">\n      <div class=\"panel\" style=\"margin-top:0\">\n        ${cart.map((i, n) => `\n          <div class=\"cart-item\">\n            <img src=\"${esc(App.img(i.image))}\" alt=\"\" onerror=\"this.onerror=null;this.src=App.ph\">\n            <div class=\"meta\">\n              <div class=\"nm\">${esc(App.lang === 'am' && i.name_am ? i.name_am : i.name_en)}<\/div>\n              <div class=\"small-muted\">${i.size ? t('size') + ': ' + esc(i.size) : ''} ${i.color ? '· ' + t('color') + ': ' + esc(i.color) : ''}<\/div>\n              <div class=\"price\" style=\"font-size:18px\">${App.money(i.price)}<\/div>\n              <div class=\"row\" style=\"margin-top:6px;justify-content:space-between\">\n                <div class=\"qty\"><button data-m=\"${n}\">−<\/button><span>${i.qty}<\/span><button data-p=\"${n}\">+<\/button><\/div>\n                <button class=\"remove\" data-r=\"${n}\">${t('remove')}<\/button>\n              <\/div>\n            <\/div>\n          <\/div>`).join('')}\n      <\/div>\n      <div>\n        <div class=\"panel\" style=\"margin-top:0\">\n          <div class=\"row\" style=\"flex-wrap:nowrap\"><input class=\"inp\" id=\"cpn\" placeholder=\"${t('coupon')}\" value=\"${coupon ? esc(coupon.code) : ''}\"><button class=\"btn small\" id=\"applyCpn\">${t('apply')}<\/button><\/div>\n          <div id=\"cpnMsg\"><\/div>\n          <div class=\"sum-row\" style=\"margin-top:10px\"><span>${t('subtotal')}<\/span><span>${App.money(tt.sub)}<\/span><\/div>\n          ${coupon ? `<div class=\"sum-row\" style=\"color:var(--ok)\"><span>${t('discount')} (${coupon.percent}%)<\/span><span>-${App.money(tt.disc)}<\/span><\/div>` : ''}\n          <div class=\"sum-row\"><span>${t('shipping')}<\/span><span>${tt.ship ? App.money(tt.ship) : t('free')}<\/span><\/div>\n          <div class=\"sum-row total\"><span>${t('total')}<\/span><span>${App.money(tt.total)}<\/span><\/div>\n        <\/div>\n        <form class=\"panel\" id=\"co\">\n          <h3 style=\"margin-bottom:12px\">${t('checkout')}<\/h3>\n          <div class=\"field\"><label>${t('full_name')}<\/label><input class=\"inp\" name=\"name\" required maxlength=\"80\" value=\"${esc(form.name)}\"><\/div>\n          <div class=\"field\"><label>${t('phone')}<\/label><input class=\"inp\" name=\"phone\" type=\"tel\" required maxlength=\"20\" placeholder=\"09...\" value=\"${esc(form.phone)}\"><\/div>\n          <div class=\"field\"><label>${t('address')}<\/label><textarea class=\"inp\" name=\"address\" rows=\"2\" required maxlength=\"300\">${esc(form.address)}<\/textarea><\/div>\n          <div class=\"field\"><label>${t('note')}<\/label><input class=\"inp\" name=\"note\" maxlength=\"300\" value=\"${esc(form.note)}\"><\/div>\n          <div class=\"field\"><label>${t('pay_method')}<\/label>\n            ${methods().map((m) => `<label class=\"pm\" style=\"display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line,#ddd);border-radius:12px;margin-bottom:8px;cursor:pointer;font-weight:600\"><input type=\"radio\" name=\"pay_method\" value=\"${m.id}\" ${payMethod === m.id ? 'checked' : ''}> ${m.id === 'cod' ? '💵 ' + t('pay_cod') : '📱 ' + esc(m.name)}<\/label>`).join('')}\n          <\/div>\n          ${(() => { const m = methods().find((x) => x.id === payMethod); return m && m.id !== 'cod' ? `<div class=\"panel\" style=\"margin:0 0 12px;background:#fff7ed;border:1px dashed #f59e0b\">\n            <div style=\"font-weight:700\">${t('pay_send')}:<\/div>\n            <div class=\"price\" style=\"font-size:20px\">${App.money(tt.total)}<\/div>\n            <div class=\"small-muted\" style=\"margin:6px 0\">${t('pay_steps')}<\/div>\n            <div style=\"margin-top:6px\"><b>${esc(m.name)}<\/b><br>${t('pay_acct')}: <b style=\"user-select:all;font-size:18px\">${esc(m.account)}<\/b> <button type=\"button\" class=\"btn small ghost\" id=\"cpAcct\" data-a=\"${esc(m.account)}\">📋 ${t('copy')}<\/button>${m.holder ? `<br>${t('pay_name')}: ${esc(m.holder)}` : ''}<\/div>\n            <div class=\"field\" style=\"margin:10px 0 0\"><label>${t('pay_ref')}<\/label><input class=\"inp\" name=\"pay_ref\" required minlength=\"4\" maxlength=\"60\" value=\"${esc(form.pay_ref || '')}\"><div class=\"small-muted\">${t('pay_ref_help')}<\/div><\/div>\n            <div class=\"field\" style=\"margin:10px 0 0\"><label>🧾 ${t('pay_proof')}<\/label><input type=\"file\" id=\"proofFile\" accept=\"image/*\">${payProof ? `<div style=\"margin-top:6px\"><img src=\"${payProof}\" alt=\"\" style=\"max-height:120px;border-radius:10px\"> <span class=\"small-muted\">${t('pay_proof_ok')}<\/span><\/div>` : ''}<\/div><\/div>` : ''; })()}\n          <div id=\"coMsg\"><\/div>\n          <button class=\"btn block\" id=\"placeBtn\">${t('place_order')} · ${App.money(tt.total)}<\/button>\n        <\/form>\n      <\/div>\n    <\/div>`;\n\n    view.querySelectorAll('[data-m]').forEach((b) => b.onclick = () => { saveForm(); const c = App.getCart(); const i = c[b.dataset.m]; i.qty = Math.max(1, i.qty - 1); App.saveCart(c); render(); });\n    view.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => { saveForm(); const c = App.getCart(); const i = c[b.dataset.p]; i.qty = Math.min(i.stock || 99, i.qty + 1); App.saveCart(c); render(); });\n    view.querySelectorAll('[data-r]').forEach((b) => b.onclick = () => { saveForm(); const c = App.getCart(); c.splice(b.dataset.r, 1); App.saveCart(c); render(); });\n\n    document.getElementById('applyCpn').onclick = async () => {\n      saveForm();\n      const code = document.getElementById('cpn').value.trim();\n      if (!code) { coupon = null; render(); return; }\n      try { coupon = await App.api('/api/coupons/validate', { method: 'POST', body: { code } }); render(); document.getElementById('cpnMsg').innerHTML = `<div class=\"msg ok\">${t('coupon_ok')}<\/div>`; }\n      catch { coupon = null; render(); document.getElementById('cpnMsg').innerHTML = `<div class=\"msg err\">${t('coupon_bad')}<\/div>`; }\n    };\n\n    document.querySelectorAll('input[name=pay_method]').forEach((r) => r.onchange = () => { saveForm(); render(); });\n    const cp = document.getElementById('cpAcct'); if (cp) cp.onclick = () => { try { navigator.clipboard.writeText(cp.dataset.a); } catch (e) {} cp.textContent = '✓ ' + t('copied'); };\n    const pf = document.getElementById('proofFile'); if (pf) pf.onchange = async () => { if (!pf.files[0]) return; saveForm(); try { payProof = await compress(pf.files[0]); } catch (e) { payProof = ''; } render(); };\n    document.getElementById('co').addEventListener('submit', async (e) => {\n      e.preventDefault();\n      const f = new FormData(e.target);\n      const btn = document.getElementById('placeBtn'); btn.disabled = true;\n      try {\n        const r = await App.api('/api/orders', { method: 'POST', body: {\n          name: f.get('name'), phone: f.get('phone'), address: f.get('address'), note: f.get('note'),\n          pay_method: f.get('pay_method') || 'cod', pay_ref: f.get('pay_ref') || '', pay_proof: (f.get('pay_method') || 'cod') === 'cod' ? '' : payProof,\n          coupon: coupon ? coupon.code : '',\n          items: App.getCart().map((i) => ({ id: i.id, qty: i.qty, size: i.size, color: i.color })),\n        } });\n        App.saveCart([]);\n        view.innerHTML = `<div class=\"panel\" style=\"text-align:center\">\n          <div style=\"font-size:54px\">✅<\/div>\n          <h2>${t('order_ok')}<\/h2>\n          <p style=\"margin:10px 0\">${t('order_no')}:<\/p>\n          <div class=\"price\" style=\"font-size:30px;color:var(--brand)\">${esc(r.order_number)}<\/div>\n          <p class=\"small-muted\" style=\"margin:8px 0 18px\">${t('save_it')}<\/p>\n          <a class=\"btn\" href=\"#/account?tab=orders\">${t('orders')}<\/a>\n          <a class=\"btn ghost\" href=\"#/index\">${t('continue')}<\/a><\/div>`;\n        window.scrollTo(0, 0);\n      } catch (er) {\n        document.getElementById('coMsg').innerHTML = `<div class=\"msg err\">${esc(er.message)}<\/div>`;\n        btn.disabled = false;\n      }\n    });\n  }\n  render();\n})();\n"]},
"contact":{"title": "Contact Us - CJ Online Shopping", "styles": "", "html": "\n<div id=\"app-header\"><\/div>\n<main class=\"container\" style=\"margin-top:16px;max-width:820px\">\n  <div class=\"prose\" id=\"am\" style=\"display:none\"><h1>አግኙን<\/h1>\n<p>ስለ ትዕዛዝ፣ ስለ መመለስ ወይም ስለ አካውንትዎ ጥያቄ አለዎት? እዚህ ያግኙን፦<\/p>\n<ul class=\"cinfo\"><\/ul>\n<\/div>\n  <div class=\"prose\" id=\"en\" style=\"display:none\"><h1>Contact Us<\/h1>\n<p>Questions about an order, a return, or your account? Reach us here:<\/p>\n<ul class=\"cinfo\"><\/ul>\n<\/div>\n<\/main>\n<div id=\"app-footer\"><\/div>\n\n\n\n", "scripts": ["App.layout(''); document.getElementById(App.lang).style.display='';\nconst C=App.cfg;document.querySelectorAll('.cinfo').forEach(u=>{u.innerHTML=`<li>📞 ${App.esc(C.PHONE)}<\/li><li>✈️ Telegram: ${App.esc(C.TELEGRAM)}<\/li><li>✉️ ${App.esc(C.EMAIL)}<\/li>`;});"]},
"index":{"title": "CJ Online Shopping", "styles": "", "html": "\n<div id=\"app-header\"><\/div>\n<main class=\"container\">\n  <section class=\"hero\" id=\"hero\">\n    <small id=\"heroS\"><\/small>\n    <h1 id=\"heroT\"><\/h1><p id=\"heroP\"><\/p>\n    <a class=\"btn\" href=\"javascript:void(document.getElementById('all').scrollIntoView({behavior:'smooth'}))\" id=\"heroBtn\"><\/a>\n  <\/section>\n  <div class=\"trust\" id=\"trust\"><\/div>\n\n  <section class=\"section\" id=\"flashSec\" style=\"display:none\">\n    <div class=\"flash\"><h2 id=\"flashT\"><\/h2><div class=\"hscroll\" id=\"flashRow\"><\/div><\/div>\n  <\/section>\n\n  <section class=\"section\" id=\"featSec\" style=\"display:none\">\n    <div class=\"section-head\"><h2 id=\"featT\"><\/h2><\/div>\n    <div class=\"grid\" id=\"featGrid\"><\/div>\n  <\/section>\n\n  <section class=\"section\" id=\"all\">\n    <div class=\"section-head\"><h2 id=\"catT\"><\/h2><span class=\"small-muted\" id=\"count\"><\/span><\/div>\n    <div class=\"chips\" id=\"chips\"><\/div>\n    <div class=\"toolbar\" style=\"margin-top:14px\">\n      <h2 id=\"allT\" style=\"font-size:20px\"><\/h2>\n      <select class=\"sel\" id=\"sort\"><\/select>\n    <\/div>\n    <div class=\"grid\" id=\"grid\"><\/div>\n  <\/section>\n<\/main>\n<div id=\"app-footer\"><\/div>\n\n\n\n\n", "scripts": ["\n(async function () {\n  if (!App.guard()) return;\n  App.layout('home');\n  const t = App.t;\n  const q = new URLSearchParams(__QS()).get('q') || '';\n  let category = '';\n  let products = [];\n\n  heroS.textContent = t('welcome'); heroT.textContent = t('hero_t'); heroP.textContent = t('hero_p'); heroBtn.textContent = t('shop_now');\n  trust.innerHTML = [['🚚', 'tr1'], ['🔒', 'tr2'], ['↩️', 'tr3'], ['💰', 'tr4']].map(([i, k]) => `<div><span>${i}<\/span>${t(k)}<\/div>`).join('');\n  flashT.textContent = t('flash'); featT.textContent = t('featured'); catT.textContent = t('categories');\n  allT.textContent = q ? `\"${q}\"` : t('all_products');\n  sort.innerHTML = `<option value=\"feat\">${t('sort')}: ${t('sort_feat')}<\/option><option value=\"new\">${t('sort_new')}<\/option><option value=\"low\">${t('sort_low')}<\/option><option value=\"high\">${t('sort_high')}<\/option>`;\n  if (q) { hero.style.display = 'none'; trust.style.display = 'none'; }\n\n  grid.innerHTML = '<div class=\"skeleton\"><\/div>'.repeat(4);\n\n  function render() {\n    let list = products.slice();\n    if (category) list = list.filter((p) => p.category === category);\n    if (sort.value === 'low') list.sort((a, b) => a.price - b.price);\n    if (sort.value === 'high') list.sort((a, b) => b.price - a.price);\n    if (sort.value === 'feat') list.sort((a, b) => b.featured - a.featured);\n    count.textContent = list.length + ' ' + t('products');\n    grid.innerHTML = list.length ? list.map(App.card).join('') : `<div class=\"empty\" style=\"grid-column:1/-1\">${t('no_products')}<\/div>`;\n    App.bindCards(grid, products);\n  }\n\n  try {\n    const [prods, cats] = await Promise.all([\n      App.api('/api/products' + (q ? '?q=' + encodeURIComponent(q) : '')),\n      App.api('/api/categories'),\n    ]);\n    products = prods;\n    chips.innerHTML = `<button class=\"chip active\" data-c=\"\">${t('all')}<\/button>` +\n      cats.map((c) => `<button class=\"chip\" data-c=\"${App.esc(c.category)}\">${App.esc(c.category)}<\/button>`).join('');\n    chips.addEventListener('click', (e) => {\n      const b = e.target.closest('.chip'); if (!b) return;\n      category = b.dataset.c;\n      chips.querySelectorAll('.chip').forEach((x) => x.classList.toggle('active', x === b));\n      render();\n    });\n    sort.addEventListener('change', render);\n\n    if (!q) {\n      const deals = products.filter((p) => p.old_price > p.price && p.stock > 0);\n      if (deals.length) { flashSec.style.display = ''; flashRow.innerHTML = deals.slice(0, 10).map(App.card).join(''); App.bindCards(flashRow, products); }\n      const feat = products.filter((p) => p.featured);\n      if (feat.length) { featSec.style.display = ''; featGrid.innerHTML = feat.slice(0, 8).map(App.card).join(''); App.bindCards(featGrid, products); }\n    }\n    render();\n  } catch (e) {\n    grid.innerHTML = `<div class=\"msg err\" style=\"grid-column:1/-1\">${App.esc(e.message)}<\/div>`;\n  }\n})();\n"]},

password\" name=\"password\" required minlength=\"8\" autocomplete=\"new-password\"><div class=\"small-muted\" id=\"hint\" style=\"margin-top:4px\"><\/div><\/div>\n      <div id=\"regMsg\"><\/div>\n      <button class=\"btn block\" id=\"regBtn\"><\/button>\n    <\/form>\n\n    <p class=\"small-muted\" style=\"text-align:center;margin-top:18px\"><a href=\"#/privacy\" style=\"text-decoration:underline\" id=\"pp\"><\/a> · <a href=\"#/terms\" style=\"text-decoration:underline\" id=\"tt\"><\/a> · <button id=\"langBtn\" style=\"background:none;border:0;text-decoration:underline;cursor:pointer;color:inherit\"><\/button><\/p>\n  <\/div>\n<\/div>\n\n\n\n", "scripts": ["\n(function () {\n  const t = App.t, esc = App.esc;\n  const next = new URLSearchParams(__QS()).get('next') || '#/index';\n  const safeNext = /^#\\/[a-z0-9_\\-]+(\\?.*)?$/i.test(next) ? next : '#/index';\n  if (App.token()) { location.replace(safeNext); return; }\n\n  sub.textContent = t('signin_sub');\n  tLogin.textContent = t('login'); tReg.textContent = t('register');\n  l1.textContent = t('email'); l2.textContent = t('password'); loginBtn.textContent = t('login_btn'); forgot.textContent = t('forgot');\n  r0.textContent = t('full_name'); r1.textContent = t('email'); r2.textContent = t('password'); r3.textContent = t('phone') + ' (' + t('note').match(/\\((.*)\\)/)[1] + ')'; regBtn.textContent = t('create_btn'); hint.textContent = t('pass_hint');\n  loginForm.password.placeholder = t('password_ph');\n  pp.textContent = t('privacy'); tt.textContent = t('terms');\n  langBtn.textContent = App.lang === 'am' ? 'English' : 'አማርኛ';\n  langBtn.onclick = () => { localStorage.setItem('cj_lang', JSON.stringify(App.lang === 'am' ? 'en' : 'am')); location.reload(); };\n\n  function tab(reg) {\n    loginForm.style.display = reg ? 'none' : ''; regForm.style.display = reg ? '' : 'none';\n    tLogin.classList.toggle('active', !reg); tReg.classList.toggle('active', reg);\n  }\n  tLogin.onclick = () => tab(false); tReg.onclick = () => tab(true);\n\n  async function submit(form, path, btn, msgBox) {\n    const f = Object.fromEntries(new FormData(form));\n    btn.disabled = true; msgBox.innerHTML = '';\n    try {\n      const r = await App.api(path, { method: 'POST', body: f });\n      App.setSession(r.token, r.user);\n      location.href = safeNext;\n    } catch (e) {\n      msgBox.innerHTML = `<div class=\"msg err\">${esc(e.message)}<\/div>`; btn.disabled = false;\n    }\n  }\n  loginForm.addEventListener('submit', (e) => { e.preventDefault(); submit(loginForm, '/api/auth/login', loginBtn, loginMsg); });\n  regForm.addEventListener('submit', (e) => { e.preventDefault(); submit(regForm, '/api/auth/register', regBtn, regMsg); });\n})();\n"]},
"privacy":{"title": "Privacy Policy - CJ Online Shopping", "styles": "", "html": "\n<div id=\"app-header\"><\/div>\n<main class=\"container\" style=\"margin-top:16px;max-width:820px\">\n  <div class=\"prose\" id=\"am\" style=\"display:none\"><h1>የግላዊነት ፖሊሲ<\/h1>\n<h3>የምንሰበስበው መረጃ<\/h3>\n<p>አካውንት ሲከፍቱ ወይም ትዕዛዝ ሲልኩ ስም፣ ኢሜይል፣ ስልክና የመላኪያ አድራሻ እንሰበስባለን። ይህ አካውንትዎን ለማስተዳደርና ትዕዛዝዎን ለማስተናገድ ብቻ ይውላል።<\/p>\n<h3>እንዴት እንጠቀምበታለን<\/h3>\n<ul><li>ትዕዛዝዎን ለማረጋገጥና ለማድረስ።<\/li><li>ስለ ትዕዛዝዎ ለማነጋገር።<\/li><li>የግል መረጃዎን ለማንም አንሸጥም።<\/li><\/ul>\n<h3>የይለፍ ቃል<\/h3>\n<p>የይለፍ ቃልዎ በሚስጥር (hash) ብቻ ነው የሚቀመጠው፤ እኛ ማየት አንችልም።<\/p>\n<h3>ምርጫዎ<\/h3>\n<p>መረጃዎን በ \"የእኔ አካውንት\" ማስተካከል ወይም አካውንትዎ እንዲሰረዝ በ \"አግኙን\" ገጽ መጠየቅ ይችላሉ።<\/p>\n<\/div>\n  <div class=\"prose\" id=\"en\" style=\"display:none\"><h1>Privacy Policy<\/h1>\n<h3>Information we collect<\/h3>\n<p>When you create an account or place an order we collect your name, email, phone number and delivery address. This is used only to run your account and to process and deliver your orders.<\/p>\n<h3>How we use it<\/h3>\n<ul><li>To confirm and deliver your orders.<\/li><li>To contact you about your order.<\/li><li>We never sell your personal information.<\/li><\/ul>\n<h3>Passwords<\/h3>\n<p>Your password is stored only as a secure hash. We cannot see it.<\/p>\n<h3>Your choices<\/h3>\n<p>You can update your details in My Account or ask us to delete your account through the Contact page.<\/p>\n<\/div>\n<\/main>\n<div id=\"app-footer\"><\/div>\n\n\n\n", "scripts": ["App.layout(''); document.getElementById(App.lang).style.display='';"]},
"product":{"title": "Product - CJ Online Shopping", "styles": "", "html": "\n<div id=\"app-header\"><\/div>\n<main class=\"container\" style=\"margin-top:16px\">\n  <div id=\"view\" class=\"loader\"><\/div>\n<\/main>\n<div id=\"app-footer\"><\/div>\n\n\n\n\n", "scripts": ["\n(async function () {\n  if (!App.guard()) return;\n  App.layout('');\n  const t = App.t, esc = App.esc;\n  const view = document.getElementById('view');\n  view.textContent = t('loading');\n  const id = new URLSearchParams(__QS()).get('id');\n  let p;\n  try { p = await App.api('/api/products/' + encodeURIComponent(id)); }\n  catch (e) { view.innerHTML = `<div class=\"empty\">${esc(e.message)}<\/div>`; return; }\n\n  document.title = App.pname(p) + ' - CJ Online Shopping';\n  const imgs = [{ k: 'front', u: p.image_front }, { k: 'side', u: p.image_side }, { k: 'top', u: p.image_top }].filter((i) => i.u);\n  if (!imgs.length) imgs.push({ k: 'front', u: '' });\n\n  let size = '', color = '', qty = 1;\n  const user = App.user() || {};\n  const stars = (n) => '★'.repeat(n) + '☆'.repeat(5 - n);\n  const avg = p.reviews.length ? p.reviews.reduce((s, r) => s + r.rating, 0) / p.reviews.length : 0;\n  const disc = p.old_price > p.price ? Math.round((1 - p.price / p.old_price) * 100) : 0;\n  const out = p.stock <= 0;\n  const isYT = /youtube\\.com|youtu\\.be/.test(p.video || '');\n\n  function render() {\n    const wished = App.getWish().includes(String(p.id));\n    view.className = '';\n    view.innerHTML = `\n    <div class=\"pd\">\n      <div class=\"gallery\">\n        <div class=\"main\"><img id=\"mainImg\" src=\"${esc(App.img(imgs[0].u))}\" alt=\"${esc(App.pname(p))}\" onerror=\"this.onerror=null;this.src=App.ph\"><\/div>\n        <div class=\"thumbs\">${imgs.map((i, n) => `<button class=\"${n === 0 ? 'active' : ''}\" data-u=\"${esc(i.u)}\"><img src=\"${esc(App.img(i.u))}\" alt=\"\" onerror=\"this.onerror=null;this.src=App.ph\"><span>${t(i.k)}<\/span><\/button>`).join('')}<\/div>\n      <\/div>\n      <div>\n        <h1>${esc(App.pname(p))}<\/h1>\n        <div class=\"small-muted\"><span class=\"stars\">${stars(Math.round(avg))}<\/span> (${p.reviews.length}) · ${esc(p.category)}<\/div>\n        <div class=\"bigprice\">${App.money(p.price)}${p.old_price > p.price ? ` <span class=\"old\">${App.money(p.old_price)}<\/span> <span class=\"tag\" style=\"position:static;display:inline-block;font-size:13px\">-${disc}%<\/span>` : ''}<\/div>\n        <div class=\"${out ? 'stock-out' : p.stock <= 5 ? 'stock-low' : 'stock-ok'}\">${out ? t('out_stock') : p.stock <= 5 ? p.stock + ' ' + t('left') : t('in_stock') + ': ' + p.stock}<\/div>\n        <p style=\"margin-top:10px;color:#374151;white-space:pre-line\">${esc(App.pdesc(p))}<\/p>\n        ${p.video ? `<div class=\"opt-title\">${t('video')}<\/div>${isYT ? `<a class=\"btn ghost small\" href=\"${esc(p.video)}\" target=\"_blank\" rel=\"noopener\">▶ ${t('video')}<\/a>` : `<video src=\"${esc(p.video)}\" controls playsinline style=\"width:100%;max-height:300px;border-radius:14px;background:#000\"><\/video>`}` : ''}\n        ${p.sizes.length ? `<div class=\"opt-title\">${t('size')}<\/div><div class=\"opts\" id=\"sizes\">${p.sizes.map((s) => `<button class=\"opt\" data-v=\"${esc(s)}\">${esc(s)}<\/button>`).join('')}<\/div>` : ''}\n        ${p.colors.length ? `<div class=\"opt-title\">${t('color')}<\/div><div class=\"opts\" id=\"colors\">${p.colors.map((s) => `<button class=\"opt\" data-v=\"${esc(s)}\">${esc(s)}<\/button>`).join('')}<\/div>` : ''}\n        <div class=\"opt-title\">${t('qty')}<\/div>\n        <div class=\"qty\"><button id=\"minus\">−<\/button><span id=\"q\">1<\/span><button id=\"plus\">+<\/button><\/div>\n        <div class=\"row\" style=\"margin-top:20px\">\n          <button class=\"btn\" id=\"add\" ${out ? 'disabled' : ''}>🛒 ${t('add_cart')}<\/button>\n          <button class=\"btn dark\" id=\"buy\" ${out ? 'disabled' : ''}>${t('buy_now')}<\/button>\n          <button class=\"btn ghost\" id=\"wish\" style=\"font-size:20px;padding:9px 16px\">${wished ? '♥' : '♡'}<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"panel\">\n      <h2 style=\"margin-bottom:10px\">${t('reviews')}<\/h2>\n      <div>${p.reviews.length ? p.reviews.map((r) => `<div class=\"review\"><b>${esc(r.name)}<\/b> <span class=\"stars\">${stars(r.rating)}<\/span><div>${esc(r.comment)}<\/div><\/div>`).join('') : `<div class=\"small-muted\">${t('no_reviews')}<\/div>`}<\/div>\n      <h3 style=\"margin:18px 0 8px\">${t('write_review')}<\/h3>\n      <form id=\"revForm\">\n        <div class=\"field\"><input class=\"inp\" name=\"name\" required maxlength=\"60\" placeholder=\"${t('your_name')}\" value=\"${esc(user.name || '')}\"><\/div>\n        <div class=\"field\"><select class=\"inp\" name=\"rating\">${[5, 4, 3, 2, 1].map((n) => `<option value=\"${n}\">${'★'.repeat(n)}<\/option>`).join('')}<\/select><\/div>\n        <div class=\"field\"><textarea class=\"inp\" name=\"comment\" rows=\"3\" maxlength=\"600\" placeholder=\"${t('comment')}\"><\/textarea><\/div>\n        <button class=\"btn\">${t('submit')}<\/button>\n      <\/form>\n    <\/div>`;\n\n    view.querySelectorAll('.thumbs button').forEach((b) => b.addEventListener('click', () => {\n      document.getElementById('mainImg').src = App.img(b.dataset.u);\n      view.querySelectorAll('.thumbs button').forEach((x) => x.classList.toggle('active', x === b));\n    }));\n    const pick = (boxId, setter) => {\n      const box = document.getElementById(boxId); if (!box) return;\n      box.addEventListener('click', (e) => {\n        const b = e.target.closest('.opt'); if (!b) return;\n        box.querySelectorAll('.opt').forEach((x) => x.classList.toggle('active', x === b));\n        setter(b.dataset.v);\n      });\n    };\n    pick('sizes', (v) => (size = v)); pick('colors', (v) => (color = v));\n    document.getElementById('minus').onclick = () => { qty = Math.max(1, qty - 1); document.getElementById('q').textContent = qty; };\n    document.getElementById('plus').onclick = () => { qty = Math.min(Math.max(1, p.stock), qty + 1); document.getElementById('q').textContent = qty; };\n\n    const validate = () => {\n      if (p.sizes.length && !size) { App.toast(t('choose_size')); return false; }\n      if (p.colors.length && !color) { App.toast(t('choose_color')); return false; }\n      return true;\n    };\n    document.getElementById('add').onclick = () => { if (!validate()) return; App.addToCart(p, qty, size, color); App.toast(t('added')); };\n    document.getElementById('buy').onclick = () => { if (!validate()) return; App.addToCart(p, qty, size, color); location.href = '#/cart'; };\n    document.getElementById('wish').onclick = (e) => { e.currentTarget.textContent = App.toggleWish(p.id) ? '♥' : '♡'; };\n\n    document.getElementById('revForm').addEventListener('submit', async (e) => {\n      e.preventDefault();\n      const f = new FormData(e.target);\n      try {\n        await App.api('/api/reviews', { method: 'POST', body: { product_id: p.id, name: f.get('name'), rating: Number(f.get('rating')), comment: f.get('comment') } });\n        p.reviews.unshift({ name: f.get('name'), rating: Number(f.get('rating')), comment: f.get('comment') });\n        App.toast(t('review_thanks')); render();\n      } catch (er) { App.toast(er.message); }\n    });\n  }\n  render();\n})();\n"]},
"returns":{"title": "Return & Refund Policy - CJ Online Shopping", "styles": "", "html": "\n<div id=\"app-header\"><\/div>\n<main class=\"container\" style=\"margin-top:16px;max-width:820px\">\n  <div class=\"prose\" id=\"am\" style=\"display:none\"><h1>የመመለስና ገንዘብ ማስመለስ ፖሊሲ<\/h1>\n<h3>የመመለሻ ጊዜ<\/h3>\n<p>የተበላሸ፣ ጉድለት ያለበት ወይም የተሳሳተ ምርት ከደረስዎ ከደረሰበት ከ 3 ቀን ውስጥ ያሳውቁን።<\/p>\n<h3>ሁኔታዎች<\/h3>\n<ul><li>ምርቱ ያልተጠቀሙበትና በመጀመሪያ ማሸጊያው ውስጥ መሆን አለበት።<\/li><li>የትዕዛዝ ቁጥርዎን ይያዙ፤ ቢቻል የችግሩን ፎቶ ይላኩ።<\/li><li>በአግባቡ ባለመጠቀም የተበላሸ ምርት አይመለስም።<\/li><\/ul>\n<h3>ገንዘብ ማስመለስ<\/h3>\n<p>የተመለሰውን ምርት ከፈተሽን በኋላ ዋጋውን እንመልሳለን ወይም ትክክለኛውን ምርት እንቀይራለን። የማድረሻ ክፍያ የሚመለሰው ስህተቱ የእኛ ሲሆን ብቻ ነው።<\/p>\n<h3>እንዴት ይጀምራል<\/h3>\n<p>\"አግኙን\" ገጽ ከፍተው የትዕዛዝ ቁጥርዎንና ምክንያቱን ይላኩልን።<\/p>\n<\/div>\n  <div class=\"prose\" id=\"en\" style=\"display:none\"><h1>Return & Refund Policy<\/h1>\n<h3>Return window<\/h3>\n<p>If you receive a damaged, defective or wrong item, contact us within 3 days of delivery.<\/p>\n<h3>Conditions<\/h3>\n<ul><li>The item must be unused and in its original packaging.<\/li><li>Keep your order number and, if possible, photos of the problem.<\/li><li>Items damaged by misuse cannot be returned.<\/li><\/ul>\n<h3>Refunds<\/h3>\n<p>After we check the returned item, we refund the price or exchange it for the right item. Delivery fees are refunded only when the mistake was ours.<\/p>\n<h3>How to start<\/h3>\n<p>Open the Contact page and send us your order number and the reason.<\/p>\n<\/div>\n<\/main>\n<div id=\"app-footer\"><\/div>\n\n\n\n", "scripts": ["App.layout(''); document.getElementById(App.lang).style.display='';"]},
"shipping":{"title": "Shipping & Delivery - CJ Online Shopping", "styles": "", "html": "\n<div id=\"app-header\"><\/div>\n<main class=\"container\" style=\"margin-top:16px;max-width:820px\">\n  <div class=\"prose\" id=\"am\" style=\"display:none\"><h1>ማድረስ<\/h1>\n<h3>የማድረሻ ክፍያ<\/h3>\n<p>ከ 3,000 ብር በላይ ለሆኑ ትዕዛዞች ማድረስ ነጻ ነው። ከዚያ በታች ለሆኑ 100 ብር የማድረሻ ክፍያ አለ።<\/p>\n<h3>የማድረሻ ጊዜ<\/h3>\n<p>ትዕዛዝዎን በስልክ እናረጋግጥና ወደ አድራሻዎ እናደርሳለን። ጊዜው እንደ አካባቢዎ ይለያያል።<\/p>\n<h3>ከማድረስ በፊት<\/h3>\n<ul><li>ትክክለኛ አድራሻና የሚሰራ ስልክ ይስጡ።<\/li><li>የትዕዛዝዎን ሁኔታ በ \"የእኔ አካውንት\" ይከታተሉ።<\/li><\/ul>\n<h3>ክፍያ<\/h3>\n<p>ሌላ ካልተነገረ በቀር ትዕዛዝዎን ሲቀበሉ ይከፍላሉ።<\/p>\n<\/div>\n  <div class=\"prose\" id=\"en\" style=\"display:none\"><h1>Shipping & Delivery<\/h1>\n<h3>Delivery fee<\/h3>\n<p>Orders of 3,000 ETB or more are delivered free. Smaller orders have a delivery fee of 100 ETB.<\/p>\n<h3>Delivery time<\/h3>\n<p>We confirm your order by phone, then deliver to your address. Delivery time depends on your location.<\/p>\n<h3>Before delivery<\/h3>\n<ul><li>Give a correct address and a phone number that is reachable.<\/li><li>Track your order status in My Account.<\/li><\/ul>\n<h3>Payment<\/h3>\n<p>You pay when you receive your order, unless we tell you otherwise.<\/p>\n<\/div>\n<\/main>\n<div id=\"app-footer\"><\/div>\n\n\n\n", "scripts": ["App.layout(''); document.getElementById(App.lang).style.display='';"]},
"terms":{"title": "Terms & Conditions - CJ Online Shopping", "styles": "", "html": "\n<div id=\"app-header\"><\/div>\n<main class=\"container\" style=\"margin-top:16px;max-width:820px\">\n  <div class=\"prose\" id=\"am\" style=\"display:none\"><h1>ውሎችና ሁኔታዎች<\/h1>\n<h3>አካውንት<\/h3>\n<p>ምርቶችን ለማየትና ለማዘዝ አካውንት ያስፈልጋል። የይለፍ ቃልዎን ሚስጥር ያድርጉ፤ በአካውንትዎ ለሚደረገው ነገር ተጠያቂ ነዎት።<\/p>\n<h3>ትዕዛዞች<\/h3>\n<p>ትዕዛዝ የሚረጋገጠው በስልክ ካነጋገርንዎ በኋላ ነው። ምርት ከሌለ ወይም መረጃው ትክክል ካልሆነ ትዕዛዝ ልንሰርዝ እንችላለን።<\/p>\n<h3>ዋጋ<\/h3>\n<p>ዋጋዎች በብር (ETB) ሲሆኑ ያለማሳወቂያ ሊቀየሩ ይችላሉ። በትዕዛዙ ጊዜ የነበረው ዋጋ ይተገበራል።<\/p>\n<h3>ክፍያ<\/h3>\n<p>ሌላ ካልተነገረ በቀር ክፍያ ሲደርስ ይፈጸማል።<\/p>\n<\/div>\n  <div class=\"prose\" id=\"en\" style=\"display:none\"><h1>Terms & Conditions<\/h1>\n<h3>Accounts<\/h3>\n<p>You need an account to browse and order. Keep your password private; you are responsible for activity on your account.<\/p>\n<h3>Orders<\/h3>\n<p>An order is confirmed after we contact you by phone. We may cancel an order if a product is unavailable or the details are incorrect.<\/p>\n<h3>Prices<\/h3>\n<p>Prices are shown in ETB and may change without notice. The price at the time of ordering applies.<\/p>\n<h3>Payment<\/h3>\n<p>Payment is made on delivery unless we tell you otherwise.<\/p>\n<\/div>\n<\/main>\n<div id=\"app-footer\"><\/div>\n\n\n\n", "scripts": ["App.layout(''); document.getElementById(App.lang).style.display='';"]},
"track":{"title": "Track Order - CJ Online Shopping", "styles": "", "html": "\n<div id=\"app-header\"><\/div>\n<main class=\"container\" style=\"margin-top:16px;max-width:760px\">\n  <h2 id=\"title\" style=\"margin-bottom:12px\"><\/h2>\n  <form class=\"panel\" id=\"f\" style=\"margin-top:0\">\n    <div class=\"field\"><label id=\"l1\"><\/label><input class=\"inp\" name=\"number\" required placeholder=\"CJ123456\"><\/div>\n    <div class=\"field\"><label id=\"l2\"><\/label><input class=\"inp\" name=\"phone\" type=\"tel\" required><\/div>\n    <button class=\"btn\" id=\"b\"><\/button>\n  <\/form>\n  <div id=\"result\"><\/div>\n<\/main>\n<div id=\"app-footer\"><\/div>\n\n\n\n\n", "scripts": ["\n(function () {\n  if (!App.guard()) return;\n  App.layout('track');\n  const t = App.t, esc = App.esc;\n  title.textContent = t('track_title'); l1.textContent = t('order_number'); l2.textContent = t('phone'); b.textContent = t('track_btn');\n  const FLOW = ['Pending', 'Confirmed', 'Processing', 'Shipped', 'Delivered'];\n  const f = document.getElementById('f');\n  const p = new URLSearchParams(__QS());\n  if (p.get('number')) f.number.value = p.get('number');\n  if (p.get('phone')) f.phone.value = p.get('phone');\n\n  async function lookup() {\n    const out = document.getElementById('result');\n    out.innerHTML = `<div class=\"loader\">${t('loading')}<\/div>`;\n    try {\n      const o = await App.api(`/api/orders/track?number=${encodeURIComponent(f.number.value.trim())}&phone=${encodeURIComponent(f.phone.value.trim())}`);\n      const idx = FLOW.indexOf(o.status);\n      const cancelled = o.status === 'Cancelled';\n      out.innerHTML = `<div class=\"panel\">\n        <div class=\"row\" style=\"justify-content:space-between\"><b>#${esc(o.order_number)}<\/b><span class=\"small-muted\">${t('placed_on')}: ${esc(o.created_at)}<\/span><\/div>\n        ${cancelled ? `<div class=\"msg err\" style=\"margin-top:12px\">${t('Cancelled')}<\/div>` : `\n        <div class=\"steps\">${FLOW.map((s, n) => `<div class=\"step ${n < idx ? 'done' : ''} ${n === idx ? 'now' : ''}\"><div class=\"dot\">${n <= idx ? '✓' : n + 1}<\/div>${t(s)}<\/div>`).join('')}<\/div>`}\n        <h3 style=\"margin:16px 0 6px\">${t('items')}<\/h3>\n        ${o.items.map((i) => `<div class=\"sum-row\"><span>${esc(App.lang === 'am' && i.name_am ? i.name_am : i.name)} × ${i.qty} <span class=\"small-muted\">${esc(i.size || '')} ${esc(i.color || '')}<\/span><\/span><span>${App.money(i.price * i.qty)}<\/span><\/div>`).join('')}\n        ${o.discount > 0 ? `<div class=\"sum-row\" style=\"color:var(--ok)\"><span>${t('discount')} (${esc(o.coupon_code)})<\/span><span>-${App.money(o.discount)}<\/span><\/div>` : ''}\n        <div class=\"sum-row\"><span>${t('shipping')}<\/span><span>${o.shipping ? App.money(o.shipping) : t('free')}<\/span><\/div>\n        <div class=\"sum-row total\"><span>${t('total')}<\/span><span>${App.money(o.total)}<\/span><\/div>\n      <\/div>`;\n    } catch (e) { out.innerHTML = `<div class=\"msg err\">${esc(e.message)}<\/div>`; }\n  }\n  f.addEventListener('submit', (e) => { e.preventDefault(); lookup(); });\n  if (p.get('number') && p.get('phone')) lookup();\n})();\n"]},
"wishlist":{"title": "Wishlist - CJ Online Shopping", "styles": "", "html": "\n<div id=\"app-header\"><\/div>\n<main class=\"container\" style=\"margin-top:14px\">\n  <h2 id=\"title\" style=\"margin-bottom:12px\"><\/h2>\n  <div class=\"grid\" id=\"grid\"><\/div>\n<\/main>\n<div id=\"app-footer\"><\/div>\n\n\n\n", "scripts": ["\n(async function () {\n  if (!App.guard()) return;\n  App.layout('wish');\n  title.textContent = App.t('wish_title');\n  const grid = document.getElementById('grid');\n  async function load() {\n    const ids = App.getWish();\n    if (!ids.length) { grid.innerHTML = `<div class=\"empty\" style=\"grid-column:1/-1\">${App.t('wish_empty')}<\/div>`; return; }\n    try {\n      const all = await App.api('/api/products');\n      const list = all.filter((p) => ids.includes(String(p.id)));\n      grid.innerHTML = list.length ? list.map(App.card).join('') : `<div class=\"empty\" style=\"grid-column:1/-1\">${App.t('wish_empty')}<\/div>`;\n      App.bindCards(grid, all, () => setTimeout(load, 150));\n    } catch (e) { grid.innerHTML = `<div class=\"empty msg err\" style=\"grid-column:1/-1\">${App.esc(e.message)}<\/div>`; }\n  }\n  load();\n})();\n"]}
}</script>
<script>
(function(){
var pages = JSON.parse(document.getElementById('pages').textContent);
var name = window.__PAGE;
if (!pages[name]) { name = window.__PAGE = 'index'; }
var pg = pages[name];
document.title = pg.title;
var holder = document.createElement('div');
holder.innerHTML = pg.styles;
Array.prototype.forEach.call(holder.querySelectorAll('style'), function(s){ document.head.appendChild(s); });
var root = document.createElement('div'); root.id = 'page-root';
root.innerHTML = pg.html;
document.body.appendChild(root);
try{ if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){}); }catch(e){}
window.addEventListener('hashchange', function(){ location.reload(); });
pg.scripts.forEach(function(code){
var s = document.createElement('script');
s.text = code;
document.body.appendChild(s);
});
window.scrollTo(0,0);
})();
</script>
</body>
